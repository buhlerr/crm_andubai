# Claude Code respondendo a menções: escreva "@claude ..." num comentário de PR ou issue.
# Só funciona para quem tem acesso de escrita ao repositório.
# Usa a assinatura do Claude (Pro/Max): segredo CLAUDE_CODE_OAUTH_TOKEN, gerado com `claude setup-token`.
# Precisa do app do Claude instalado no repositório: https://github.com/apps/claude
name: Claude - menções

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # contents: write deixa o Claude criar commits/branches quando pedido ("@claude corrija isso").
      # Troque para "read" se quiser que ele só responda.
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1.0.272
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --append-system-prompt "Responda em português claro. Siga AGENTS.md (regras do projeto), docs/REGRAS_CHECKLIST.md e REGRAS_PAUTAS.md. Nunca remova o módulo de Pautas TM, o login por PBKDF2 ou o leitor Calamine. Nunca use nomes reais ou dados pessoais."
