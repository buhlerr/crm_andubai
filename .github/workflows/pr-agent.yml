# Revisão automática de PRs com o PR-Agent (https://github.com/The-PR-Agent/pr-agent) usando Claude.
# Precisa do segredo ANTHROPIC_KEY em Settings → Secrets and variables → Actions.
# Ao abrir um PR: descrição, revisão e sugestões. Nos comentários do PR: /review, /describe, /improve, /ask "...".
name: PR-Agent

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]

jobs:
  pr_agent:
    # Não responde a bots (evita laço com os próprios comentários).
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: PR-Agent
        # Versão fixa da imagem (e não @main): o passo recebe a chave da Anthropic.
        uses: docker://pragent/pr-agent:0.50.0-github_action
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ANTHROPIC.KEY: ${{ secrets.ANTHROPIC_KEY }}
          config.model: "anthropic/claude-sonnet-5-5"
          config.fallback_models: '["anthropic/claude-haiku-5-5"]'
          config.response_language: "pt-BR"
          github_action_config.auto_describe: "true"
          github_action_config.auto_review: "true"
          github_action_config.auto_improve: "true"
