services:
  crm-checklist:
    # Imagem publicada pelo workflow "Testes e imagem" a cada merge na master.
    # Atualizar: docker compose pull && docker compose up -d   (precisa de: docker login ghcr.io)
    # Para gerar a imagem nesta máquina em vez de baixar: docker compose up -d --build
    image: ${CRM_IMAGEM:-ghcr.io/buhlerr/crm_andubai:latest}
    build: .
    container_name: crm_andubai
    restart: unless-stopped
    ports:
      - "${PORTA:-8080}:8080"
    environment:
      - CHECKLIST_DADOS=/dados
      - SERVIDOR_HOST=0.0.0.0
      - SERVIDOR_PORTA=8080
      - SERVIDOR_THREADS=8
      - ATRAS_DE_PROXY=${ATRAS_DE_PROXY:-1}
      - SECRET_KEY=${SECRET_KEY}
      - LOGIN_PROVISORIO=${LOGIN_PROVISORIO:-0}
      - SENHA_PROVISORIA=${SENHA_PROVISORIA}
    volumes:
      # O volume persistente guarda o banco de dados checklist.db, logs e backups
      - crm_dados:/dados

volumes:
  crm_dados:
    driver: local
